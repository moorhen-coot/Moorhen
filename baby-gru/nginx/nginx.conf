server {
    listen 80;

    # Compress responses in transit. moorhen64.wasm is 19 MB as served and about 6 MB gzipped,
    # and nginx compresses nothing by default (and only text/html even with gzip on). The .tar.gz
    # data archives are already compressed, so they are not listed. gzip_static sends a
    # pre-compressed foo.gz next to foo when one exists, which saves compressing the WASM on
    # every request.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/javascript text/css application/json image/svg+xml;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html =404;
        add_header 'Cross-Origin-Opener-Policy' 'same-origin';
        add_header 'Cross-Origin-Embedder-Policy' 'require-corp';
    }
}
